name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.4.1 -> JDK 17 zorunlu
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 9.6.0 (AGP 9.4 minimum)
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Compose 1.12.1 -> compileSdk 37, build-tools 36.0.0
      # NOT: android-actions/setup-android KULLANILMIYOR.
      # v3 hala var olmayan 'tools' paketini kurmaya calisiyor ve
      # "Failed to find package 'tools'" ile cokuyor.
      # ubuntu-latest'te Android SDK onceden kurulu; sdkmanager PATH'te
      # olmadigi icin mutlak yol ile cagriliyor.
      #
      # ONEMLI: Android 37 artik minor surumlu yayimlaniyor.
      # "platforms;android-37" YOK; "platforms;android-37.0" var.
      - name: SDK bilesenleri
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" \
                                 "platforms;android-37.0" \
                                 "build-tools;36.0.0"

      - name: Derle
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: novatv-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Derleme logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build/reports/
          retention-days: 7
