name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.4.1 -> JDK 17 zorunlu
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 9.6.0 (AGP 9.4 minimum)
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Compose 1.12.1 -> compileSdk 37, build-tools 36.0.0
      # NOT: android-actions/setup-android KULLANILMIYOR.
      # v3 hala var olmayan 'tools' paketini kurmaya calisiyor ve
      # "Failed to find package 'tools'" ile cokuyor.
      # ubuntu-latest'te Android SDK onceden kurulu; sdkmanager PATH'te
      # olmadigi icin mutlak yol ile cagriliyor.
      #
      # ONEMLI: Android 37 artik minor surumlu yayimlaniyor.
      # "platforms;android-37" YOK; "platforms;android-37.0" var.
      - name: SDK bilesenleri
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" \
                                 "platforms;android-37.0" \
                                 "build-tools;36.0.0"

      - name: Derle
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon

      - name: APK bilgisi
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for f in app/build/outputs/apk/*/*.apk; do
            echo "=== $f ($(du -h "$f" | cut -f1)) ==="
            "$BT/aapt2" dump badging "$f" \
              | grep -E "^(package:|sdkVersion|targetSdkVersion|native-code|uses-feature|leanback)" || true
            echo
          done

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: novatv-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: APK doğrulama
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for f in app/build/outputs/apk/*/*.apk; do
            echo "=== $f ==="
            if "$BT/apksigner" verify --print-certs "$f"; then
              echo "  IMZA GECERLI"
            else
              echo "  !!! IMZA GECERSIZ"
            fi
            # Native kutuphaneler 16 KB sayfa hizalamasina uygun mu
            "$BT/zipalign" -c -P 16 -v 4 "$f" > /dev/null 2>&1 \
              && echo "  zipalign OK" || echo "  zipalign uyarisi"
          done

      - name: Derleme logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build/reports/
          retention-days: 7
