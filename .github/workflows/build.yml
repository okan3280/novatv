name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.4.1 -> JDK 17 zorunlu
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 9.6.0 (AGP 9.4 minimum)
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Compose 1.12.1 -> compileSdk 37, build-tools 36.0.0
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK bileşenleri
        run: |
          sdkmanager "platform-tools" \
                    "platforms;android-37" \
                    "build-tools;36.0.0"

      - name: Lisansları kabul et
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Derle
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: novatv-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Derleme logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build/reports/
          retention-days: 7
