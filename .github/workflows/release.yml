name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: İmzalı APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # setup-android@v3 kullanilmiyor: 'tools' paketini arıyor ve cokuyor.
      # ubuntu-latest'te SDK onceden kurulu; sdkmanager mutlak yol ile.
      - name: SDK bilesenleri
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" \
                                 "platforms;android-37" \
                                 "build-tools;36.0.0"

      # Ana anahtar repo'ya girmez; GitHub Secrets'tan gelir.
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret tanımlı değil"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: İmzalı derle
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: İmzayı doğrula
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/*.apk

      - name: APK adını hazırla
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "NovaTV-${GITHUB_REF#refs/tags/}.apk"
          echo "path=NovaTV-${GITHUB_REF#refs/tags/}.apk" >> $GITHUB_OUTPUT

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## NovaTV ${{ github.ref_name }}

            Android TV IPTV istemcisi · TCL 65Q6C

            **Kurulum:** Ayarlar → Güvenlik → Bilinmeyen kaynaklardan yükleme
            **Hedef:** arm64-v8a · minSdk 24 · compileSdk 37
          draft: false

      - name: Temizlik
        if: always()
        run: rm -f release.keystore
